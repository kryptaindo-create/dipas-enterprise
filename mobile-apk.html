    function getTraderItemBreakdown(trader) {
      if (!trader) return [];
      const skema = trader.skemaTagihan || 'BULANAN';
      const rates = DEFAULT_BUDGET_RATES[skema] || DEFAULT_BUDGET_RATES.BULANAN;
      const codes = trader.budgetItems || ['TB', 'KEB', 'LM', 'LA', 'JAMAL'];
      
      const list = [];
      codes.forEach(code => {
        const rate = rates[code] || { label: code, amount: 20000 };
        list.push({
          code: code,
          label: rate.label,
          amount: rate.amount
        });
      });

      if (trader.spCount > 0 && !codes.includes('DTB') && !codes.includes('DKEB')) {
        list.push({
          code: 'DENDA_SP',
          label: `Denda SP-${trader.spCount} (Keterlambatan)`,
          amount: trader.spCount * 50000
        });
      }

      return list;
    }

    // =========================================================================

      const calculatedTotalRetribusi = itemBreakdown.reduce((sum, item) => sum + item.amount, 0);

      return (
        <form onSubmit={(e) => { e.preventDefault(); handleExecuteRetribusiPayment(activeTrader, itemBreakdown, calculatedTotalRetribusi); }} className="space-y-4 font-sans">

                <Search className="w-4 h-4 text-emerald-400" />

              </div>

                      className={`p-3 rounded-xl border cursor-pointer transition flex items-center justify-between ${

      const [toiletQty, setToiletQty] = useState(1);
      const [toiletTotalAmount, setToiletTotalAmount] = useState(() => {
        return parseInt(localStorage.getItem('dipas_toilet_total')) || 180000;
      });

      const [searchQuery, setSearchQuery] = useState('');

      const [autoSuggestOpen, setAutoSuggestOpen] = useState(false);

      // PAYMENT FLOW MODAL STATES
      const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
      const [paymentStep, setPaymentStep] = useState('SELECT_METHOD'); // 'SELECT_METHOD' | 'QRIS_DISPLAY'
      const [pendingPaymentData, setPendingPaymentData] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState(null);
      const [isPrinting, setIsPrinting] = useState(false);
      const [printSuccessAlert, setPrintSuccessAlert] = useState(false);

          txType: txType || transactionType,
          trader: trader || selectedTrader || tradersData[0],
          total: total || currentFinalTotal,
          breakdown: breakdown || []
        });
        setPaymentStep('SELECT_METHOD');
        setIsPaymentModalOpen(true);
      };

      useEffect(() => {
        try {
          localStorage.setItem('dipas_informal_total', informalCollectedAmount.toString());
          localStorage.setItem('dipas_parking_total', parkingTotalAmount.toString());
          localStorage.setItem('dipas_toilet_total', toiletTotalAmount.toString());

      }, [informalCollectedAmount, parkingTotalAmount, toiletTotalAmount]);

      const collectorName = 'Bambang Haryono';
      const collectorId = 'KLT-01';

      const currentPeriodLabel = `Agustus 2026`;

      const totalHariIniRp = 768800 + lunasList.length * 350000 + informalCollectedAmount + parkingTotalAmount + toiletTotalAmount;

      const calculatedInformalTotal = (informalService?.tariff || 2000) * informalQty;
      const calculatedToiletTotal = (selectedToiletService?.tariff || 2000) * toiletQty;

      const currentFinalTotal = transactionType === 'RETRIBUSI_TOILET'

                  <div className="thermal-receipt-paper p-4 rounded-t-2xl font-mono-thermal text-[10.5px] leading-tight space-y-2 max-w-[280px] mx-auto text-slate-900">
                    <div className="text-center border-b border-dashed border-slate-400 pb-1.5">
                      <strong className="text-xs font-black block uppercase tracking-tight">PUD PASAR KOTA MEDAN</strong>
                      <span className="text-[10px] font-bold block text-slate-800">BUKTI RETRIBUSI PASAR RESMI</span>
                    </div>

                    <div className="space-y-0.5 border-b border-dashed border-slate-400 pb-1.5 text-[10px]">
                      <div className="flex justify-between"><span>No. Resi:</span><strong>{completedReceipt.trxNo}</strong></div>
                      <div className="flex justify-between"><span>Waktu   :</span><span>{completedReceipt.dateTime}</span></div>
                      <div className="flex justify-between"><span>Pedagang:</span><strong className="truncate max-w-[130px]">{completedReceipt.traderName}</strong></div>
                      <div className="flex justify-between"><span>Kios    :</span><span>{completedReceipt.traderStall}</span></div>
                      <div className="flex justify-between"><span>Pasar   :</span><span className="font-bold truncate max-w-[130px]">{completedReceipt.market}</span></div>
                      <div className="flex justify-between"><span>Metode  :</span><strong className="text-emerald-800 font-bold">{completedReceipt.paymentMethodLabel || 'TUNAI / CASH'}</strong></div>
                      <div className="flex justify-between"><span>Petugas :</span><span>{completedReceipt.collector}</span></div>
                    </div>

                    {/* ITEMIZED BREAKDOWN ON THERMAL RECEIPT */}
                    <div className="border-b border-dashed border-slate-400 pb-1.5 pt-1 space-y-0.5 text-[9.5px]">
                      <div className="font-bold text-[9px] uppercase tracking-wider text-slate-700 mb-1 border-b border-dashed border-slate-300 pb-0.5 font-sans">
                        RINCIAN KOMPONEN TAGIHAN:
                      </div>
                      {completedReceipt.itemBreakdown && completedReceipt.itemBreakdown.length > 0 ? (
                        completedReceipt.itemBreakdown.map((item, idx) => (
                          <div key={idx} className="flex justify-between items-center text-slate-900">
                            <span className="truncate max-w-[160px]">{item.label}</span>
                            <span className="font-bold shrink-0">Rp {item.amount.toLocaleString('id-ID')}</span>
                          </div>
                        ))
                      ) : (
                        <>
                          <div className="flex justify-between items-center text-slate-900">
                            <span>Tempat Berjualan Harian (TB)</span>
                            <span className="font-bold">Rp 150.000</span>
                          </div>
                          <div className="flex justify-between items-center text-slate-900">
                            <span>Retribusi Kebersihan Harian</span>
                            <span className="font-bold">Rp 50.000</span>
                          </div>
                          <div className="flex justify-between items-center text-slate-900">
                            <span>Listrik Abodemen / Air</span>
                            <span className="font-bold">Rp 20.000</span>
                          </div>
                          <div className="flex justify-between items-center text-slate-900">
                            <span>Denda Keterlambatan TB</span>
                            <span className="font-bold">Rp 80.000</span>
                          </div>
                          <div className="flex justify-between items-center text-slate-900">
                            <span>Denda Kebersihan</span>
                            <span className="font-bold">Rp 55.000</span>
                          </div>
                        </>
                      )}
                    </div>

                    <div className="border-b border-dashed border-slate-400 pb-1.5 text-center pt-1">
                      <span className="text-[9.5px] font-bold block text-slate-600 font-sans uppercase">TOTAL RETRIBUSI LUNAS</span>
                      <strong className="text-base font-black block text-slate-950 font-mono">
                        Rp {completedReceipt.totalNominal.toLocaleString('id-ID')}
                      </strong>
                    </div>

                    <div className="text-center pt-0.5 space-y-1">
                      <div className="w-20 h-20 bg-white p-1 mx-auto rounded border border-slate-900 flex items-center justify-center">
                        <img
                          src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://dipas.medan.go.id/verify?trx=${completedReceipt.trxNo}%26hash=${completedReceipt.securityHash}`}
                          alt="Security Barcode"
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <strong className="text-[9px] font-mono font-bold text-slate-900 block tracking-wider">
                        {completedReceipt.securityHash}
                      </strong>
                    </div>
                  </div>
                ) : completedReceipt.isSiptbReceipt ? (
                  /* COMPACT SIPTB RECEIPT WITH ITEM BREAKDOWN */
                  <div className="thermal-receipt-paper p-4 rounded-t-2xl font-mono-thermal text-[10.5px] leading-tight space-y-2 max-w-[280px] mx-auto text-slate-900">
                    <div className="text-center border-b border-dashed border-slate-400 pb-1.5">
                      <strong className="text-xs font-black block uppercase tracking-tight">PUD PASAR KOTA MEDAN</strong>
                      <span className="text-[10px] font-bold block text-slate-800">BUKTI PERPANJANGAN SIPTB</span>
                    </div>

                    <div className="space-y-0.5 border-b border-dashed border-slate-400 pb-1.5 text-[10px]">
                      <div className="flex justify-between"><span>No. Resi:</span><strong>{completedReceipt.trxNo}</strong></div>
                      <div className="flex justify-between"><span>No.SIPTB :</span><strong>{completedReceipt.siptbNo}</strong></div>
                      <div className="flex justify-between"><span>Waktu   :</span><span>{completedReceipt.dateTime}</span></div>
                      <div className="flex justify-between"><span>Pedagang:</span><strong className="truncate max-w-[130px]">{completedReceipt.traderName}</strong></div>
                      <div className="flex justify-between"><span>Masa s/d:</span><span className="font-bold text-emerald-800">19 Agustus 2027</span></div>
                      <div className="flex justify-between"><span>Petugas :</span><span>{completedReceipt.collector}</span></div>
                    </div>

                    <div className="border-b border-dashed border-slate-400 pb-1.5 pt-1 space-y-0.5 text-[9.5px]">
                      <div className="font-bold text-[9px] uppercase tracking-wider text-slate-700 mb-1 border-b border-dashed border-slate-300 pb-0.5 font-sans">
                        RINCIAN BIAYA PERPANJANGAN SIPTB:
                      </div>
                      <div className="flex justify-between items-center text-slate-900">
                        <span>Biaya Legalisasi SIPTB (1 Thn)</span>
                        <span className="font-bold">Rp {(completedReceipt.totalNominal - 10000).toLocaleString('id-ID')}</span>
                      </div>
                      <div className="flex justify-between items-center text-slate-900">
                        <span>Biaya Administrasi & Verifikasi</span>
                        <span className="font-bold">Rp 10.000</span>
                      </div>
                    </div>

                    <div className="border-b border-dashed border-slate-400 pb-1.5 text-center pt-1">
                      <span className="text-[9.5px] font-bold block text-slate-600 font-sans uppercase">TOTAL NOMINAL SIPTB</span>
                      <strong className="text-base font-black block text-slate-950 font-mono">
                        Rp {completedReceipt.totalNominal.toLocaleString('id-ID')}
                      </strong>
                    </div>

                    <div className="text-center pt-0.5 space-y-1">
                      <div className="w-20 h-20 bg-white p-1 mx-auto rounded border border-slate-900 flex items-center justify-center">
                        <img
                          src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://dipas.medan.go.id/verify?trx=${completedReceipt.trxNo}%26hash=${completedReceipt.securityHash}`}
                          alt="Security Barcode"
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <strong className="text-[9px] font-mono font-bold text-slate-900 block tracking-wider">
                        {completedReceipt.securityHash}
                      </strong>
                    </div>
                  </div>
                ) : completedReceipt.isToiletReceipt ? (
                  /* COMPACT TOILET RECEIPT (58mm MINI FORMAT) */
                  <div className="thermal-receipt-paper p-4 rounded-t-2xl font-mono-thermal text-[10.5px] leading-tight space-y-2 max-w-[280px] mx-auto text-slate-900">
                    <div className="text-center border-b border-dashed border-slate-400 pb-1.5">
                      <strong className="text-xs font-black block uppercase tracking-tight">PUD PASAR KOTA MEDAN</strong>
                      <span className="text-[10px] font-bold block text-slate-800">BUKTI RETRIBUSI TOILET / SANITASI</span>
                    </div>

                    <div className="space-y-0.5 border-b border-dashed border-slate-400 pb-1.5 text-[10px]">
                      <div className="flex justify-between"><span>No. Resi:</span><strong>{completedReceipt.trxNo}</strong></div>
                      <div className="flex justify-between"><span>Waktu   :</span><span>{completedReceipt.dateTime}</span></div>
                      <div className="flex justify-between"><span>Pasar   :</span><span className="font-bold truncate max-w-[130px]">{completedReceipt.market}</span></div>
                      <div className="flex justify-between"><span>Petugas :</span><span>{completedReceipt.collector}</span></div>
                      <div className="flex justify-between"><span>Layanan :</span><strong className="truncate max-w-[130px]">{completedReceipt.toiletServiceName}</strong></div>
                      <div className="flex justify-between"><span>Pengunjung:</span><strong>{completedReceipt.toiletQty} Orang</strong></div>
                    </div>

                    <div className="border-b border-dashed border-slate-400 pb-1.5 text-center">
                      <span className="text-[9.5px] font-bold block text-slate-600">TOTAL RETRIBUSI TOILET</span>
                      <strong className="text-base font-black block text-slate-950">
                        Rp {completedReceipt.totalNominal.toLocaleString('id-ID')}
                      </strong>
                    </div>

                    <div className="text-center pt-0.5 space-y-1">
                      <div className="w-20 h-20 bg-white p-1 mx-auto rounded border border-slate-900 flex items-center justify-center">
                        <img
                          src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://dipas.medan.go.id/verify?trx=${completedReceipt.trxNo}%26hash=${completedReceipt.securityHash}`}
                          alt="Security Barcode"
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <strong className="text-[9px] font-mono font-bold text-slate-900 block tracking-wider">
                        {completedReceipt.securityHash}
                      </strong>
                    </div>
                  </div>
                ) : completedReceipt.isParkingReceipt ? (
                  /* COMPACT PARKING RECEIPT */
                  <div className="thermal-receipt-paper p-4 rounded-t-2xl font-mono-thermal text-[10.5px] leading-tight space-y-2 max-w-[280px] mx-auto text-slate-900">
                    <div className="text-center border-b border-dashed border-slate-400 pb-1.5">
                      <strong className="text-xs font-black block uppercase tracking-tight">PUD PASAR KOTA MEDAN</strong>
                      <span className="text-[10px] font-bold block text-slate-800">KARCIS PARKIR RESMI</span>
                    </div>

                    <div className="space-y-0.5 border-b border-dashed border-slate-400 pb-1.5 text-[10px]">
                      <div className="flex justify-between"><span>No. Resi:</span><strong>{completedReceipt.trxNo}</strong></div>
                      <div className="flex justify-between"><span>Waktu   :</span><span>{completedReceipt.dateTime}</span></div>
                      <div className="flex justify-between"><span>Pasar   :</span><span className="font-bold truncate max-w-[130px]">{completedReceipt.market}</span></div>
                      <div className="flex justify-between"><span>Kendaraan:</span><strong className="truncate max-w-[130px]">{completedReceipt.vehicleName}</strong></div>
                      <div className="flex justify-between"><span>No. Plat :</span><strong className="tracking-wider">{completedReceipt.plateNumber}</strong></div>
                    </div>

                    <div className="border-b border-dashed border-slate-400 pb-1.5 text-center">
                      <span className="text-[9.5px] font-bold block text-slate-600">TOTAL TARIF PARKIR</span>
                      <strong className="text-base font-black block text-slate-950">
                        Rp {completedReceipt.totalNominal.toLocaleString('id-ID')}
                      </strong>
                    </div>

                    <div className="text-center pt-0.5 space-y-1">
                      <div className="w-20 h-20 bg-white p-1 mx-auto rounded border border-slate-900 flex items-center justify-center">
                        <img
                          src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://dipas.medan.go.id/verify?trx=${completedReceipt.trxNo}%26hash=${completedReceipt.securityHash}`}
                          alt="Security Barcode"
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <strong className="text-[9px] font-mono font-bold text-slate-900 block tracking-wider">
                        {completedReceipt.securityHash}
                      </strong>
                    </div>
                  </div>
                ) : (
                  <div className="thermal-receipt-paper p-4 rounded-t-2xl font-mono-thermal text-[10.5px] leading-tight space-y-2 max-w-[280px] mx-auto text-slate-900">
                    <div className="text-center border-b border-dashed border-slate-400 pb-1.5">
                      <strong className="text-xs font-black block uppercase tracking-tight">PUD PASAR KOTA MEDAN</strong>
                      <span className="text-[10px] font-bold block text-slate-800">BUKTI RETRIBUSI INFORMAL (PKL)</span>
                    </div>

                    <div className="space-y-0.5 border-b border-dashed border-slate-400 pb-1.5 text-[10px]">
                      <div className="flex justify-between"><span>No. Resi:</span><strong>{completedReceipt.trxNo}</strong></div>
                      <div className="flex justify-between"><span>Waktu   :</span><span>{completedReceipt.dateTime}</span></div>
                      <div className="flex justify-between"><span>Pasar   :</span><span className="font-bold truncate max-w-[130px]">{completedReceipt.market}</span></div>
                      <div className="flex justify-between"><span>Petugas :</span><span>{completedReceipt.collector}</span></div>
                    </div>

                    <div className="border-b border-dashed border-slate-400 pb-1.5 text-center">
                      <span className="text-[9.5px] font-bold block text-slate-600 font-sans uppercase">TOTAL NOMINAL PKL</span>
                      <strong className="text-base font-black block text-slate-950 font-mono">
                        Rp {completedReceipt.totalNominal.toLocaleString('id-ID')}
                      </strong>
                    </div>

                    <div className="text-center pt-0.5 space-y-1">
                      <div className="w-20 h-20 bg-white p-1 mx-auto rounded border border-slate-900 flex items-center justify-center">
                        <img
                          src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://dipas.medan.go.id/verify?trx=${completedReceipt.trxNo}%26hash=${completedReceipt.securityHash}`}
                          alt="Security Barcode"
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <strong className="text-[9px] font-mono font-bold text-slate-900 block tracking-wider">
                        {completedReceipt.securityHash}
                      </strong>
                    </div>
                  </div>
                )}

                {printSuccessAlert && (
                  <div className="p-3 bg-emerald-950 border border-emerald-500 text-emerald-300 rounded-2xl text-xs text-center font-bold flex items-center justify-center gap-2">
                    <Check className="w-4 h-4 text-emerald-400" />
                    <span>✓ Struk Berhasil Dicetak ke Printer Thermal Bluetooth!</span>
                  </div>
                )}

                <div className="flex gap-2">
                  <button
                    onClick={handlePrintThermalBluetooth}
                    disabled={isPrinting}
                    className="flex-1 py-3.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-black rounded-2xl text-xs shadow-xl flex items-center justify-center gap-2 cursor-pointer border border-emerald-300"
                  >
                    <Printer className={`w-4 h-4 ${isPrinting ? 'animate-spin' : ''}`} />
                    <span>{isPrinting ? 'Mencetak Struk...' : '🖨️ CETAK STRUK (PRINT THERMAL)'}</span>
                  </button>

                  <button
                    onClick={() => setCompletedReceipt(null)}
                    className="px-5 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl text-xs border border-slate-700 cursor-pointer"
                  >
                    Tutup
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MobileApkApp />);
  </script>
</body>
</html>
