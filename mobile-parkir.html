<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DIPAS Mobile Parkir APK - PUD Pasar Kota Medan</title>
  
  <!-- Offline / Fast Vendor Scripts with Online CDN Fallbacks -->
  <script src="./vendor/react.min.js"></script>
  <script>if (!window.React) document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');</script>

  <script src="./vendor/react-dom.min.js"></script>
  <script>if (!window.ReactDOM) document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');</script>

  <script src="./vendor/babel.min.js"></script>
  <script>if (!window.Babel) document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');</script>

  <script src="./vendor/lucide.min.js"></script>
  <script>if (!window.lucide) document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');</script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (!window.tailwind) document.write('<script src="./vendor/tailwindcss.js"><\/script>');
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Inconsolata:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif; }
    .font-mono-thermal { font-family: 'Inconsolata', 'Courier New', monospace; }
    body { background-color: #090d16; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    
    .mobile-app-shell {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      background: #0f172a;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .thermal-receipt-paper {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }
    .thermal-receipt-paper::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(-45deg, transparent 5px, #fff 0), linear-gradient(45deg, transparent 5px, #fff 0);
      background-repeat: repeat-x;
      background-size: 10px 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function createLucideIcon(iconName) {
      return function LucideIcon({ className = "w-4 h-4", ...props }) {
        useEffect(() => {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            try { window.lucide.createIcons(); } catch (err) {}
          }
        });
        return <i data-lucide={iconName} className={className} {...props}></i>;
      };
    }

    const CreditCard = createLucideIcon("credit-card");
    const Search = createLucideIcon("search");
    const CheckCircle2 = createLucideIcon("check-circle-2");
    const ShieldCheck = createLucideIcon("shield-check");
    const Calculator = createLucideIcon("calculator");
    const Zap = createLucideIcon("zap");
    const TrendingUp = createLucideIcon("trending-up");
    const Calendar = createLucideIcon("calendar");
    const DollarSign = createLucideIcon("dollar-sign");
    const User = createLucideIcon("user");
    const LayoutGrid = createLucideIcon("layout-grid");
    const QrCode = createLucideIcon("qr-code");
    const Printer = createLucideIcon("printer");
    const Wifi = createLucideIcon("wifi");
    const Check = createLucideIcon("check");
    const Ticket = createLucideIcon("ticket");
    const Car = createLucideIcon("car");
    const Truck = createLucideIcon("truck");
    const Bike = createLucideIcon("bike");
    const ShieldAlert = createLucideIcon("shield-alert");

    const VEHICLE_TYPES = [
      { id: 'MOTOR', name: 'Sepeda Motor', tariff: 2000, icon: 'bike', badge: 'Roda 2', color: 'emerald' },
      { id: 'MOBIL', name: 'Mobil / SUV / Sedan', tariff: 3000, icon: 'car', badge: 'Roda 4', color: 'cyan' },
      { id: 'TRUK', name: 'Truk / Bus / Berat', tariff: 5000, icon: 'truck', badge: 'Roda 6+', color: 'amber' }
    ];

    function MobileParkirApp() {
      const [selectedVehicle, setSelectedVehicle] = useState(VEHICLE_TYPES[0]);
      const [plateNumber, setPlateNumber] = useState('');
      const [parkingMarket, setParkingMarket] = useState('Pasar Pusat Medan');
      
      const [parkingTotalAmount, setParkingTotalAmount] = useState(() => {
        return parseInt(localStorage.getItem('dipas_parking_total')) || 450000;
      });

      const [parkingTxCount, setParkingTxCount] = useState(() => {
        return parseInt(localStorage.getItem('dipas_parking_tx_count')) || 142;
      });

      const [isPrinting, setIsPrinting] = useState(false);
      const [printSuccessAlert, setPrintSuccessAlert] = useState(false);
      const [completedReceipt, setCompletedReceipt] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem('dipas_parking_total', parkingTotalAmount.toString());
          localStorage.setItem('dipas_parking_tx_count', parkingTxCount.toString());
        } catch (e) {}
      }, [parkingTotalAmount, parkingTxCount]);

      const now = new Date();
      const formattedDate = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      const formattedTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
      
      const collectorName = 'Bambang Haryono';
      const collectorId = 'PRK-01';
      const collectorRoleTitle = 'Juru Parkir Lapangan (Pasar Pusat Medan)';

      const handleExecuteParkingPayment = (e) => {
        if (e && e.preventDefault) e.preventDefault();

        const generatedTrxNo = `TRX-PRK-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${Math.floor(1000 + Math.random() * 9000)}`;
        const generatedSecHash = `SEC-AUTH-PRK-${Math.random().toString(36).substring(2, 8).toUpperCase()}-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;

        const tariff = selectedVehicle.tariff;
        setParkingTotalAmount(prev => prev + tariff);
        setParkingTxCount(prev => prev + 1);

        setCompletedReceipt({
          trxNo: generatedTrxNo,
          securityHash: generatedSecHash,
          market: parkingMarket,
          vehicleName: selectedVehicle.name,
          vehicleBadge: selectedVehicle.badge,
          plateNumber: plateNumber ? plateNumber.toUpperCase() : '-',
          tariff: tariff,
          collector: `${collectorName} (${collectorId})`,
          dateTime: `${formattedDate} - ${formattedTime}`
        });
      };

      const handlePrintThermalBluetooth = () => {
        setIsPrinting(true);
        setTimeout(() => {
          setIsPrinting(false);
          setPrintSuccessAlert(true);
          setTimeout(() => setPrintSuccessAlert(false), 4000);
        }, 1500);
      };

      return (
        <div className="mobile-app-shell">
          
          {/* HEADER BANNER PETUGAS PARKIR */}
          <div className="p-4 bg-gradient-to-r from-slate-900 via-amber-950 to-slate-900 border-b border-slate-800 space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-300">
                  <Car className="w-4 h-4" />
                </div>
                <div>
                  <strong className="text-xs font-black text-white block">{collectorName} ({collectorId})</strong>
                  <span className="text-[10px] text-amber-300 block">{collectorRoleTitle}</span>
                </div>
              </div>
              <span className="px-2 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full text-[9.5px] font-mono font-bold flex items-center gap-1">
                <Zap className="w-3 h-3 text-emerald-400" /> ONLINE Sync
              </span>
            </div>

            <div className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center text-[10.5px] font-mono">
              <span className="text-slate-400">Pasar Terikat:</span>
              <strong className="text-amber-300">{parkingMarket}</strong>
            </div>
          </div>

          {/* MAIN APP CONTENT */}
          <div className="flex-1 p-4 space-y-4 overflow-y-auto font-sans">
            
            {/* CARDS REKAPITULASI PARKIR HARI INI */}
            <div className="grid grid-cols-2 gap-2.5 font-mono">
              <div className="p-3.5 bg-gradient-to-br from-amber-950 via-slate-900 to-slate-950 rounded-2xl border border-amber-500/40 space-y-1 shadow">
                <span className="text-[10px] text-amber-300 font-sans font-bold block flex items-center gap-1">
                  <DollarSign className="w-3.5 h-3.5 text-amber-400" /> TOTAL SETORAN PARKIR:
                </span>
                <strong className="text-base font-black text-amber-400 block">
                  Rp {parkingTotalAmount.toLocaleString('id-ID')}
                </strong>
                <span className="text-[9px] text-amber-200 block font-sans">Real-Time Sync ke Pusat</span>
              </div>

              <div className="p-3.5 bg-gradient-to-br from-cyan-950 via-slate-900 to-slate-950 rounded-2xl border border-cyan-500/40 space-y-1 shadow">
                <span className="text-[10px] text-cyan-300 font-sans font-bold block flex items-center gap-1">
                  <Ticket className="w-3.5 h-3.5 text-cyan-400" /> TOTAL KARCIS TERBIT:
                </span>
                <strong className="text-base font-black text-cyan-300 block">
                  {parkingTxCount} Karcis
                </strong>
                <span className="text-[9px] text-cyan-200 block font-sans">Tanggal {formattedDate}</span>
              </div>
            </div>

            {/* FORM PEMILIHAN KENDARAAN & TARIF PARKIR */}
            <form onSubmit={handleExecuteParkingPayment} className="space-y-4">
              
              {/* 1. PEMILIHAN JENIS KENDARAAN */}
              <div className="bg-slate-900 p-4 rounded-2xl border border-amber-500/40 space-y-3 shadow-lg">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div className="flex items-center gap-1.5">
                    <Car className="w-4 h-4 text-amber-400" />
                    <h3 className="font-extrabold text-xs text-white">Pilih Jenis Kendaraan</h3>
                  </div>
                  <span className="text-[10px] font-mono text-slate-400">Tarif Resmi Perda</span>
                </div>

                <div className="grid grid-cols-1 gap-2.5">
                  {VEHICLE_TYPES.map((v) => {
                    const isSelected = selectedVehicle.id === v.id;
                    return (
                      <div
                        key={v.id}
                        onClick={() => setSelectedVehicle(v)}
                        className={`p-3.5 rounded-2xl border cursor-pointer transition flex items-center justify-between ${
                          isSelected
                            ? 'bg-gradient-to-r from-amber-950 via-slate-900 to-slate-900 border-amber-400 text-white shadow-lg ring-2 ring-amber-400 scale-[1.01]'
                            : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black ${
                            isSelected ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-400'
                          }`}>
                            {v.id === 'MOTOR' ? <Bike className="w-5 h-5" /> : v.id === 'MOBIL' ? <Car className="w-5 h-5" /> : <Truck className="w-5 h-5" />}
                          </div>
                          <div>
                            <strong className="text-xs font-black text-white block">{v.name}</strong>
                            <span className="px-2 py-0.2 bg-slate-800 text-slate-300 text-[9px] font-mono rounded-md inline-block mt-0.5">
                              {v.badge}
                            </span>
                          </div>
                        </div>

                        <div className="text-right font-mono">
                          <span className="text-[9.5px] text-slate-400 block font-sans">Tarif Flat:</span>
                          <strong className="text-sm font-black text-amber-400">Rp {v.tariff.toLocaleString('id-ID')}</strong>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* 2. INPUT NOMOR PLAT KENDARAAN (OPSIONAL) */}
              <div className="bg-slate-900 p-4 rounded-2xl border border-amber-500/40 space-y-2.5 shadow-lg">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div className="flex items-center gap-1.5">
                    <ShieldCheck className="w-4 h-4 text-cyan-400" />
                    <h3 className="font-extrabold text-xs text-white">Nomor Plat Kendaraan (Opsional)</h3>
                  </div>
                  <span className="text-[9.5px] font-mono text-slate-400">Transparansi Security</span>
                </div>

                <div className="space-y-1">
                  <label className="text-[11px] font-bold text-slate-300 block">Ketik Nomor Plat (Misal: BK 1234 ABC)</label>
                  <input
                    type="text"
                    placeholder="Contoh: BK 8899 AB..."
                    value={plateNumber}
                    onChange={(e) => setPlateNumber(e.target.value.toUpperCase())}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs font-mono font-black text-cyan-300 focus:outline-none focus:border-amber-500 uppercase tracking-widest placeholder:normal-case placeholder:font-sans placeholder:font-normal"
                  />
                  <p className="text-[9.5px] text-slate-400 italic pt-0.5">
                    * Kosongkan jika penerbitan karcis dilakukan secara cepat tanpa catat plat.
                  </p>
                </div>
              </div>

              {/* SUMMARY BAYAR & TOMBOL AKSI PROSES KARCIS PARKIR */}
              <div className="p-4 bg-gradient-to-r from-amber-950 via-slate-950 to-amber-950 rounded-2xl border border-amber-500/40 flex justify-between items-center font-mono shadow-inner">
                <div className="space-y-0.5 font-sans">
                  <span className="text-[10px] text-slate-400 block">Jenis Kendaraan Terpilih:</span>
                  <strong className="text-xs text-amber-300 font-extrabold block">{selectedVehicle.name} ({selectedVehicle.badge})</strong>
                </div>
                <div className="text-right">
                  <span className="text-[9.5px] text-slate-400 font-sans block uppercase font-bold">TOTAL NOMINAL:</span>
                  <strong className="text-lg font-black text-amber-400 block">
                    Rp {selectedVehicle.tariff.toLocaleString('id-ID')}
                  </strong>
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-4 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black rounded-2xl text-sm shadow-xl shadow-amber-500/30 flex items-center justify-center gap-2 cursor-pointer border border-amber-300 uppercase tracking-wider transition hover:scale-[1.01]"
              >
                <Printer className="w-5 h-5 text-slate-950" />
                <span>PROSES KARCIS PARKIR</span>
              </button>
            </form>

          </div>

          {/* STRUK THERMAL BLUETOOTH KARCIS PARKIR */}
          {completedReceipt && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="max-w-md w-full my-8 space-y-4">
                
                <div className="p-3 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between text-xs text-white">
                  <div className="flex items-center gap-2">
                    <Wifi className="w-4 h-4 text-cyan-400 animate-pulse" />
                    <div>
                      <span className="font-mono text-[11px] font-bold text-cyan-300 block">Printer Thermal Bluetooth: POS-5802</span>
                      <span className="text-[9.5px] text-emerald-400 font-mono">Status: Connected (MAC: 66:32:B1:88:FE)</span>
                    </div>
                  </div>
                  <button onClick={() => setCompletedReceipt(null)} className="text-slate-400 hover:text-white text-base">✕</button>
                </div>

                <div className="thermal-receipt-paper p-4 rounded-t-2xl font-mono-thermal text-[10.5px] leading-tight space-y-2 max-w-[280px] mx-auto text-slate-900">
                  
                  {/* COMPACT HEADER */}
                  <div className="text-center border-b border-dashed border-slate-400 pb-1.5">
                    <strong className="text-xs font-black block uppercase tracking-tight">PUD PASAR KOTA MEDAN</strong>
                    <span className="text-[10px] font-bold block text-slate-800">KARCIS PARKIR RESMI</span>
                  </div>

                  {/* COMPACT DETAILS */}
                  <div className="space-y-0.5 border-b border-dashed border-slate-400 pb-1.5 text-[10px]">
                    <div className="flex justify-between"><span>No. Resi:</span><strong>{completedReceipt.trxNo}</strong></div>
                    <div className="flex justify-between"><span>Waktu   :</span><span>{completedReceipt.dateTime}</span></div>
                    <div className="flex justify-between"><span>Pasar   :</span><span className="font-bold truncate max-w-[130px]">{completedReceipt.market}</span></div>
                    <div className="flex justify-between"><span>Kendaraan:</span><strong className="truncate max-w-[130px]">{completedReceipt.vehicleName}</strong></div>
                    <div className="flex justify-between"><span>No. Plat :</span><strong className="tracking-wider">{completedReceipt.plateNumber}</strong></div>
                  </div>

                  {/* COMPACT TARIF */}
                  <div className="border-b border-dashed border-slate-400 pb-1.5 text-center">
                    <span className="text-[9.5px] font-bold block text-slate-600">TOTAL TARIF PARKIR</span>
                    <strong className="text-base font-black block text-slate-950">
                      Rp {completedReceipt.tariff.toLocaleString('id-ID')}
                    </strong>
                  </div>

                  {/* COMPRESSED QR CODE & SHORT HASH */}
                  <div className="text-center pt-0.5 space-y-1">
                    <div className="w-20 h-20 bg-white p-1 mx-auto rounded border border-slate-900 flex items-center justify-center">
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://dipas.medan.go.id/verify?trx=${completedReceipt.trxNo}%26hash=${completedReceipt.securityHash}`}
                        alt="Security Barcode"
                        className="w-full h-full object-contain"
                      />
                    </div>
                    <strong className="text-[9px] font-mono font-bold text-slate-900 block tracking-wider">
                      {completedReceipt.securityHash}
                    </strong>
                  </div>

                </div>

                {printSuccessAlert && (
                  <div className="p-3 bg-emerald-950 border border-emerald-500 text-emerald-300 rounded-2xl text-xs text-center font-bold flex items-center justify-center gap-2">
                    <Check className="w-4 h-4 text-emerald-400" />
                    <span>✓ Struk Karcis Parkir Berhasil Dicetak ke Printer Thermal!</span>
                  </div>
                )}

                <div className="flex gap-2">
                  <button
                    onClick={handlePrintThermalBluetooth}
                    disabled={isPrinting}
                    className="flex-1 py-3.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-black rounded-2xl text-xs shadow-xl flex items-center justify-center gap-2 cursor-pointer border border-emerald-300"
                  >
                    <Printer className={`w-4 h-4 ${isPrinting ? 'animate-spin' : ''}`} />
                    <span>{isPrinting ? 'Mencetak Karcis Parkir...' : '🖨️ CETAK STRUK (PRINT THERMAL)'}</span>
                  </button>

                  <button
                    onClick={() => { setCompletedReceipt(null); setPlateNumber(''); }}
                    className="px-5 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl text-xs border border-slate-700 cursor-pointer"
                  >
                    Tutup
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MobileParkirApp />);
  </script>
</body>
</html>
